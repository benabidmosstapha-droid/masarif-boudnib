<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصاريف بوذنيب</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 16px; color: #1f2937; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    h1 { margin: 0 0 6px; font-size: 20px; color: #0f5132; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin: 10px 0 4px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    button { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 8px; background: #198754; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
    .summary { display: flex; justify-content: space-between; gap: 8px; text-align: center; }
    .box { flex: 1; background: #f9fafb; border-radius: 10px; padding: 10px; }
    .val { font-size: 17px; font-weight: bold; margin-top: 4px; }
    .item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .del { background: #dc3545; color: #fff; border: 0; border-radius: 6px; padding: 4px 8px; width: auto; margin: 0; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>مصاريف بوذنيب</h1>
    <div class="sub">تتبع المصاريف اليومية والشهرية بسهولة</div>
    <div class="summary">
      <div class="box"><div>المجموع</div><div class="val" id="total">0 درهم</div></div>
      <div class="box"><div>عدد العمليات</div><div class="val" id="count">0</div></div>
    </div>
  </div>

  <div class="card">
    <label>البيان (مثال: كراء، ماكلة، تنقل)</label>
    <input id="title" type="text" placeholder="اكتب اسم المصروف" />
    <label>المبلغ (درهم)</label>
    <input id="amount" type="number" step="0.01" placeholder="0" />
    <button onclick="addExpense()">إضافة مصروف</button>
  </div>

  <div class="card">
    <strong>قائمة المصاريف</strong>
    <div id="list"></div>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem("masarif_boudnib") || "[]");
    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      let sum = 0;
      items.forEach((it, idx) => {
        sum += Number(it.amount || 0);
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `<span>${it.title} — <strong>${it.amount} درهم</strong></span><button class="del" onclick="removeItem(${idx})">حذف</button>`;
        list.appendChild(row);
      });
      document.getElementById("total").textContent = sum.toFixed(2) + " درهم";
      document.getElementById("count").textContent = items.length;
      localStorage.setItem("masarif_boudnib", JSON.stringify(items));
    }
    function addExpense() {
      const title = document.getElementById("title").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      if (!title || isNaN(amount) || amount <= 0) return;
      items.unshift({ title, amount });
      document.getElementById("title").value = "";
      document.getElementById("amount").value = "";
      render();
    }
    function removeItem(idx) {
      items.splice(idx, 1);
      render();
    }
    render();
  </script>
</body>
</html>
